# arduino-cli build profiles. Each profile pins the board core and points at
# the libraries vendored in ../libraries, so a fresh machine needs only
# arduino-cli itself:
#
#   arduino-cli compile --profile uno
#   arduino-cli upload  --profile uno -p COM5
#
# See ../build.sh for a wrapper that also opens the serial monitor.

default_profile: nano_every

profiles:
  # Primary target. ATmega4809 on the arduino:megaavr core, not arduino:avr.
  # Has a hardware Serial1 on D0/D1 separate from the USB port.
  nano_every:
    fqbn: arduino:megaavr:nona4809
    platforms:
      - platform: arduino:megaavr (1.8.8)
    libraries:
      - dir: ../libraries/NeoNextion
      - dir: ../libraries/AccelStepper

  uno:
    fqbn: arduino:avr:uno
    platforms:
      - platform: arduino:avr (1.8.6)
    libraries:
      - dir: ../libraries/NeoNextion
      - dir: ../libraries/AccelStepper

  nano:
    fqbn: arduino:avr:nano:cpu=atmega328old
    platforms:
      - platform: arduino:avr (1.8.6)
    libraries:
      - dir: ../libraries/NeoNextion
      - dir: ../libraries/AccelStepper

  mega:
    fqbn: arduino:avr:mega:cpu=atmega2560
    platforms:
      - platform: arduino:avr (1.8.6)
    libraries:
      - dir: ../libraries/NeoNextion
      - dir: ../libraries/AccelStepper
