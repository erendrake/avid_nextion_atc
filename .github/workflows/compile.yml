name: Compile sketches

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: ${{ matrix.sketch }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per sketch per profile. Each sketch's sketch.yaml pins the
        # board core (and libraries), so CI builds exactly what ./build.sh
        # builds locally. Add a profile or sketch there, then add it here.
        sketch: [Nextion_Tester, NextionBridge]
        profile: [nano_every, uno, nano, mega]

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache board cores
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ runner.os }}-${{ hashFiles('**/sketch.yaml') }}

      - name: Compile
        run: ./build.sh build -s ${{ matrix.sketch }} -p ${{ matrix.profile }}

      - name: Compile raw-dump variant
        if: matrix.sketch == 'Nextion_Tester'
        run: ./build.sh build -s ${{ matrix.sketch }} -p ${{ matrix.profile }} --raw-dump
