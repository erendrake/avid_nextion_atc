name: Compile sketches

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per profile in Nextion_Tester/sketch.yaml. The profile pins
        # the board core and the vendored libraries, so CI builds exactly what
        # ./build.sh builds locally. Add a profile there, then add it here.
        profile: [nano_every, uno, nano, mega]

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache board cores
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ runner.os }}-${{ hashFiles('Nextion_Tester/sketch.yaml') }}

      - name: Compile (${{ matrix.profile }})
        run: ./build.sh build -p ${{ matrix.profile }}

      - name: Compile raw-dump variant (${{ matrix.profile }})
        run: ./build.sh build -p ${{ matrix.profile }} --raw-dump
